<!DOCTYPE HTML>
    <html lang="en">
    <head>
        <meta charset="UTF-8">  <!--Choosing a universal format-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Phone Support-->
        <link rel="stylesheet" href="style.css"> <!--Connecting CSS-->
        <title>OctaPixel</title>
    </head>
    <body>
        <h6>MADE BY @TheOctahedron (GitHub..)</h6>
        <div id="app">
            <div id="toolbar">
                <button data-tool="square">■ SQUARE</button>
                <button data-tool="circle">● CIRCLE</button>
                <button data-tool="triangle">▲ TRIANGLE</button>
                <button data-tool="octahedron">◆ OCTAHEDRON</button>
                <button data-tool="text">✎ Pencil</button>
                <input type="color" id="colorPicker" value="#ff5722">
                <button id="clear">💥 CLEAR</button>
            </div>
            <canvas id="canvas"></canvas>
            <div id="gallery"></div>
        </div>
        <script src="script.js"></script>
    </body>
    </html>
